<svg width="680" viewBox="0 0 680 1300" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family: Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text font-size="15" font-weight="500" x="340" y="28" text-anchor="middle" fill="#1a1a1a">Architecture de GlobalGroup Travel</text>
  <text font-size="12" x="340" y="48" text-anchor="middle" fill="#555">author: YEM KANA RAOUL</text>

  <!-- Account (Clients) — teal -->
  <rect x="30" y="70" width="220" height="160" rx="6" fill="#0F6E56" stroke="#085041" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" x="40" y="90" fill="#9FE1CB">Account (Clients)</text>
  <text font-size="12" x="40" y="108" fill="#5DCAA5" font-style="italic">Standard</text>
  <line x1="30" y1="114" x2="250" y2="114" stroke="#5DCAA5" stroke-width="0.5" opacity="0.5"/>
  <text font-size="12" x="40" y="130" fill="#E1F5EE">Id : Id</text>
  <text font-size="12" x="40" y="146" fill="#E1F5EE">Name : Text (REQ)</text>
  <text font-size="12" x="40" y="162" fill="#E1F5EE">Phone : Phone</text>
  <text font-size="12" x="40" y="178" fill="#E1F5EE">Website : Url</text>
  <text font-size="12" x="40" y="194" fill="#E1F5EE">BillingAddress : Address</text>
  <text font-size="12" x="40" y="210" fill="#E1F5EE">ShippingAddress : Address</text>

  <!-- Contract (Contrats) — purple -->
  <rect x="420" y="70" width="230" height="160" rx="6" fill="#534AB7" stroke="#3C3489" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" x="430" y="90" fill="#CECBF6">Contract (Contrats)</text>
  <text font-size="12" x="430" y="108" fill="#AFA9EC" font-style="italic">Standard</text>
  <line x1="420" y1="114" x2="650" y2="114" stroke="#AFA9EC" stroke-width="0.5" opacity="0.5"/>
  <text font-size="12" x="430" y="130" fill="#EEEDFE">Id : Id</text>
  <text font-size="12" x="430" y="146" fill="#EEEDFE">AccountId : Lookup(Account)</text>
  <text font-size="12" x="430" y="162" fill="#EEEDFE">ContractNumber : Auto (Text)</text>
  <text font-size="12" x="430" y="178" fill="#EEEDFE">StartDate : Date</text>
  <text font-size="12" x="430" y="194" fill="#EEEDFE">EndDate : Date</text>
  <text font-size="12" x="430" y="210" fill="#EEEDFE">Status : Picklist</text>

  <!-- Arrow Account -> Contract -->
  <line x1="250" y1="130" x2="418" y2="130" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)" opacity="0.6"/>
  <text font-size="12" x="334" y="122" text-anchor="middle" fill="#555" opacity="0.7">has many</text>

  <!-- Trip__c (Voyages) — coral -->
  <rect x="400" y="310" width="250" height="240" rx="6" fill="#993C1D" stroke="#712B13" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" x="410" y="330" fill="#F5C4B3">Trip__c (Voyages)</text>
  <text font-size="12" x="410" y="348" fill="#F0997B" font-style="italic">Custom</text>
  <line x1="400" y1="354" x2="650" y2="354" stroke="#F0997B" stroke-width="0.5" opacity="0.5"/>
  <text font-size="12" x="410" y="370" fill="#FAECE7">Id : Id</text>
  <text font-size="12" x="410" y="386" fill="#FAECE7">Name : Auto Number</text>
  <text font-size="12" x="410" y="402" fill="#FAECE7">Status__c : Picklist [A venir,</text>
  <text font-size="12" x="420" y="416" fill="#FAECE7">En cours, Terminé, Annulé]</text>
  <text font-size="12" x="410" y="432" fill="#FAECE7">Destination__c : Text</text>
  <text font-size="12" x="410" y="448" fill="#FAECE7">Start_Date__c : Date</text>
  <text font-size="12" x="410" y="464" fill="#FAECE7">End_Date__c : Date</text>
  <text font-size="12" x="410" y="480" fill="#FAECE7">Number_of_Participants__c : Number</text>
  <text font-size="12" x="410" y="496" fill="#FAECE7">Total_Cost__c : Currency</text>
  <text font-size="12" x="410" y="512" fill="#FAECE7">Account__c : Lookup(Account)</text>
  <text font-size="12" x="410" y="528" fill="#FAECE7">Opportunity__c : Lookup(Opportunity)</text>

  <!-- Arrow Account -> Trip__c -->
  <path d="M 140 230 L 140 430 L 398 430" fill="none" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)" opacity="0.5"/>
  <text font-size="12" x="200" y="442" text-anchor="middle" fill="#555" opacity="0.7">lookup</text>

  <!-- Opportunity (Ventes) — amber -->
  <rect x="400" y="640" width="250" height="240" rx="6" fill="#854F0B" stroke="#633806" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" x="410" y="660" fill="#FAC775">Opportunity (Ventes)</text>
  <text font-size="12" x="410" y="678" fill="#EF9F27" font-style="italic">Standard</text>
  <line x1="400" y1="684" x2="650" y2="684" stroke="#EF9F27" stroke-width="0.5" opacity="0.5"/>
  <text font-size="12" x="410" y="700" fill="#FAEEDA">Id : Id</text>
  <text font-size="12" x="410" y="716" fill="#FAEEDA">Name : Text (REQ)</text>
  <text font-size="12" x="410" y="732" fill="#FAEEDA">StageName : Picklist (REQ)</text>
  <text font-size="12" x="410" y="748" fill="#FAEEDA">CloseDate : Date (REQ)</text>
  <text font-size="12" x="410" y="764" fill="#FAEEDA">Amount : Currency</text>
  <text font-size="12" x="410" y="780" fill="#FAEEDA">AccountId : Lookup(Account)</text>
  <text font-size="12" x="410" y="800" fill="#EF9F27" font-style="italic">Custom Fields</text>
  <text font-size="12" x="410" y="816" fill="#FAEEDA">Number_of_Participants__c : Number</text>
  <text font-size="12" x="410" y="832" fill="#FAEEDA">Destination__c : Text</text>
  <text font-size="12" x="410" y="848" fill="#FAEEDA">Start_Date__c : Date</text>
  <text font-size="12" x="410" y="864" fill="#FAEEDA">End_Date__c : Date</text>

  <!-- Arrow Opportunity -> Trip__c -->
  <line x1="525" y1="640" x2="525" y2="552" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)" opacity="0.5" stroke-dasharray="4 3"/>
  <text font-size="11" x="540" y="600" text-anchor="start" fill="#555" opacity="0.7">Closed Won → creates Trip__c (GGT-02)</text>

  <!-- Arrow Account -> Opportunity -->
  <path d="M 250 180 L 525 180 L 525 638" fill="none" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)" opacity="0.5"/>
  <text font-size="12" x="390" y="175" text-anchor="middle" fill="#555" opacity="0.7">has many</text>

  <!-- Task (Historiques) — blue -->
  <rect x="30" y="780" width="240" height="220" rx="6" fill="#185FA5" stroke="#0C447C" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" x="40" y="800" fill="#B5D4F4">Task (Historiques)</text>
  <text font-size="12" x="40" y="818" fill="#85B7EB" font-style="italic">Standard</text>
  <line x1="30" y1="824" x2="270" y2="824" stroke="#85B7EB" stroke-width="0.5" opacity="0.5"/>
  <text font-size="12" x="40" y="840" fill="#E6F1FB">Id : Id</text>
  <text font-size="12" x="40" y="856" fill="#E6F1FB">Subject : Text</text>
  <text font-size="12" x="40" y="872" fill="#E6F1FB">Status : Picklist</text>
  <text font-size="12" x="40" y="888" fill="#E6F1FB">Priority : Picklist</text>
  <text font-size="12" x="40" y="904" fill="#E6F1FB">ActivityDate : Date (Due)</text>
  <text font-size="12" x="40" y="920" fill="#E6F1FB">OwnerId : Lookup(User)</text>
  <text font-size="11" x="40" y="936" fill="#E6F1FB">WhatId : Lookup(Account/Opportunity/Trip__c)</text>
  <text font-size="12" x="40" y="952" fill="#E6F1FB">WhoId : Lookup(Contact/Lead)</text>

  <!-- Arrow Account -> Task -->
  <path d="M 140 230 L 140 778" fill="none" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)" opacity="0.5" stroke-dasharray="4 3"/>
  <text font-size="12" x="72" y="520" text-anchor="middle" fill="#555" opacity="0.7">related to (WhatId)</text>

  <!-- Arrow Opportunity -> Task -->
  <line x1="400" y1="760" x2="272" y2="900" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)" opacity="0.5" stroke-dasharray="4 3"/>
  <text font-size="12" x="350" y="820" text-anchor="middle" fill="#555" opacity="0.7">related to (WhatId)</text>

  <!-- User — gray -->
  <rect x="30" y="1090" width="200" height="150" rx="6" fill="#5F5E5A" stroke="#444441" stroke-width="0.5"/>
  <text font-size="14" font-weight="500" x="40" y="1110" fill="#D3D1C7">User</text>
  <text font-size="12" x="40" y="1128" fill="#B4B2A9" font-style="italic">Standard</text>
  <line x1="30" y1="1134" x2="230" y2="1134" stroke="#B4B2A9" stroke-width="0.5" opacity="0.5"/>
  <text font-size="12" x="40" y="1150" fill="#F1EFE8">Id : Id</text>
  <text font-size="12" x="40" y="1166" fill="#F1EFE8">Name : Text</text>
  <text font-size="12" x="40" y="1182" fill="#F1EFE8">Email : Email</text>
  <text font-size="12" x="40" y="1198" fill="#F1EFE8">ProfileId : Lookup(Profile)</text>
  <text font-size="12" x="40" y="1214" fill="#F1EFE8">IsActive : Checkbox</text>

  <!-- Arrow Task -> User -->
  <line x1="150" y1="1000" x2="150" y2="1088" stroke="#555" stroke-width="0.5" marker-end="url(#arrow)" opacity="0.5" stroke-dasharray="4 3"/>
  <text font-size="12" x="164" y="1050" fill="#555" opacity="0.7">owns (OwnerId)</text>
</svg>
